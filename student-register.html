<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Student Digital Locker student account.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://anandhjeeva861-cmyk.github.io/student_digital_locker_github_ready/student-register.html">
  <link rel="icon" type="image/png" href="./images/sankara-logo.png">
  <title>Student Registration | Student Digital Locker</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <section class="auth-wrap">
    <form class="auth-card wide-card animate-pop" id="studentRegisterForm" method="post" action="./student-register.html">
      <a href="./student-login.html" class="back-link">← Student login</a>
      <img class="site-logo auth-logo" src="./images/sankara-logo.png" alt="Sankara Educational Institutions logo">
      <h1>REGISTER AS A STUDENT</h1>
      <div class="form-grid">
        <div><label for="studentNameInput">Name (Caps only)</label><input id="studentNameInput" class="caps-input" name="name" placeholder="RAJA S" autocomplete="name" required></div>
        <div><label for="studentRegNoInput">Register Number</label><input id="studentRegNoInput" class="caps-input" name="regNo" placeholder="25BSC003" required></div>
        <div><label for="studentEmailInput">Email</label><input id="studentEmailInput" type="email" name="email" placeholder="student@example.com" autocomplete="username" required></div>
        <div><label for="studentYearInput">Academic Year</label><input id="studentYearInput" name="year" data-academic-year placeholder="2025-2028" pattern="20[0-9]{2}-20[0-9]{2}" title="Enter academic year like 2025-2028" required></div>
        <div><label for="studentDepartmentInput">Department</label><select id="studentDepartmentInput" name="department" data-options="departments" required></select></div>
        <div><label for="studentMobileInput">Mobile Number</label><input id="studentMobileInput" name="mobile" placeholder="9876543210" autocomplete="tel" required></div>
        <div><label for="studentPasswordInput">Create Password</label><input id="studentPasswordInput" type="password" name="password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6"></div>
        <div><label for="studentRecoveryQuestion">Recovery Question</label><select id="studentRecoveryQuestion" name="recoveryQuestion" data-options="recovery-questions" required></select></div>
        <div class="full-span"><label for="studentRecoveryAnswer">Recovery Answer</label><input id="studentRecoveryAnswer" type="password" name="recoveryAnswer" placeholder="Enter your answer" autocomplete="off" required minlength="2" maxlength="100" aria-describedby="studentRecoveryHelp"><small id="studentRecoveryHelp" class="field-help">Spaces and letter case will not affect your answer.</small></div>
      </div>
      <button class="primary-btn" type="submit">CREATE STUDENT ACCOUNT</button>
    </form>
  </section>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/darkmode.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
