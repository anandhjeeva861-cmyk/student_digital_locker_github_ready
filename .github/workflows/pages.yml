name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          required=(SUPABASE_URL SUPABASE_ANON_KEY)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is missing"
              exit 1
            fi
          done

      - name: Generate Supabase config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p js
          cat > js/supabase-config.js <<EOF
          import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

          const SUPABASE_URL = "$SUPABASE_URL";
          const SUPABASE_ANON_KEY = "$SUPABASE_ANON_KEY";

          export const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          EOF

      - name: Verify static site files
        shell: bash
        run: |
          test -f index.html
          test -f .nojekyll
          test -f css/style.css
          test -f images/sankara-logo.png
          test -f js/auth.js
          test -f js/student.js
          test -f js/teacher.js
          test -f js/supabase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
