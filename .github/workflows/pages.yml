name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase API key input
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}"
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Missing FIREBASE_API_KEY. Add it as a GitHub Actions repository variable or secret."
            exit 1
          fi

      - name: Generate Firebase browser config
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}"
        run: npm run config:firebase

      - name: Verify static frontend
        run: npm run build

      - name: Prepare Pages artifact
        run: npm run pages:artifact

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
