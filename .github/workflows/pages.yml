name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Enforce GitHub Actions Pages source
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Validate Firebase API key input
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}"
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Missing FIREBASE_API_KEY. Add it as a GitHub Actions repository variable or secret."
            exit 1
          fi

      - name: Generate Firebase browser config
        env:
          FIREBASE_API_KEY: "${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}"
        run: npm run config:firebase

      - name: Verify static frontend
        run: npm run build

      - name: Prepare Pages artifact
        run: npm run pages:artifact

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Firebase configuration
        env:
          SITE_URL: "${{ steps.deployment.outputs.page_url }}"
        run: |
          config_url="${SITE_URL%/}/js/firebase-config.js"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              -H "Cache-Control: no-cache" \
              "${config_url}?deployment=${GITHUB_SHA}" \
              --output /tmp/firebase-config.js \
              && grep --quiet "export const firebaseConfig" /tmp/firebase-config.js; then
              echo "Firebase browser configuration is available on GitHub Pages."
              exit 0
            fi
            sleep 5
          done
          echo "Firebase browser configuration is missing from the deployed GitHub Pages site."
          exit 1
