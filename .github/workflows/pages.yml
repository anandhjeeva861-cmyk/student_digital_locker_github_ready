name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate Firebase secrets
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_MEASUREMENT_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is missing"
              exit 1
            fi
          done

      - name: Generate Firebase config
        shell: bash
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          mkdir -p js
          cat > js/firebase-config.js <<EOF
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
          import { getFirestore } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
          import { getStorage } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";

          const firebaseConfig = {
            apiKey: "$VITE_FIREBASE_API_KEY",
            authDomain: "$VITE_FIREBASE_AUTH_DOMAIN",
            projectId: "$VITE_FIREBASE_PROJECT_ID",
            storageBucket: "$VITE_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "$VITE_FIREBASE_MESSAGING_SENDER_ID",
            appId: "$VITE_FIREBASE_APP_ID",
            measurementId: "$VITE_FIREBASE_MEASUREMENT_ID"
          };

          const app = initializeApp(firebaseConfig);

          const auth = getAuth(app);
          const db = getFirestore(app);
          const storage = getStorage(app);

          export { app, auth, db, storage };
          EOF

      - name: Verify static site files
        shell: bash
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/auth.js
          test -f js/student.js
          test -f js/teacher.js
          test -f js/firebase-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
