<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Student Digital Locker teacher account for a department and teaching batch scope.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://anandhjeeva861-cmyk.github.io/student_digital_locker_github_ready/teacher-register.html">
  <link rel="icon" type="image/png" href="./images/sankara-logo.png">
  <title>Teacher Registration | Student Digital Locker</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <section class="auth-wrap">
    <form class="auth-card wide-card animate-pop" id="teacherRegisterForm" method="post" action="./teacher-register.html">
      <a href="./teacher-login.html" class="back-link">← Teacher login</a>
      <img class="site-logo auth-logo" src="./images/sankara-logo.png" alt="Sankara Educational Institutions logo">
      <h1>REGISTER AS A TEACHER</h1>
      <div class="form-grid">
        <div><label for="teacherNameInput">Name (Caps only)</label><input id="teacherNameInput" class="caps-input" name="name" placeholder="PRIYA R" autocomplete="name" required></div>
        <div><label for="teacherEmailInput">Email</label><input id="teacherEmailInput" type="email" name="email" placeholder="teacher@example.com" autocomplete="username" required></div>
        <div><label for="teacherDepartmentInput">Department</label><select id="teacherDepartmentInput" name="department" data-options="departments" required></select></div>
        <div><label for="teacherBatchInput">Which Batch Year Students Do You Teach?</label><input id="teacherBatchInput" name="teachingBatch" data-academic-year placeholder="2025-2028" pattern="20[0-9]{2}-20[0-9]{2}" title="Enter a three-year teaching batch like 2025-2028" required></div>
        <div><label for="teacherMobileInput">Mobile Number</label><input id="teacherMobileInput" name="mobile" placeholder="9876543210" autocomplete="tel" required></div>
        <div><label for="teacherPasswordInput">Create Password</label><input id="teacherPasswordInput" type="password" name="password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6"></div>
        <div><label for="teacherRecoveryQuestion">Recovery Question</label><select id="teacherRecoveryQuestion" name="recoveryQuestion" data-options="recovery-questions" required></select></div>
        <div><label for="teacherRecoveryAnswer">Recovery Answer</label><input id="teacherRecoveryAnswer" type="password" name="recoveryAnswer" placeholder="Enter your answer" autocomplete="off" required minlength="2" maxlength="100" aria-describedby="teacherRecoveryHelp"><small id="teacherRecoveryHelp" class="field-help">Spaces and letter case will not affect your answer.</small></div>
      </div>
      <button class="primary-btn" type="submit">CREATE TEACHER ACCOUNT</button>
    </form>
  </section>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/darkmode.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
