{% extends 'base.html' %}
{% block title %}Student Login{% endblock %}
{% block public_content %}
<section class="auth-wrap">
    <form class="auth-card animate-pop" method="POST">
        <a href="{{ url_for('login') }}" class="back-link">← Back</a>
        <h1>STUDENT LOGIN</h1>
        <label>Email</label>
        <input type="email" name="email" placeholder="student@example.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
        <button class="primary-btn" type="submit">LOGIN</button>
        <p class="auth-note">New student? <a href="{{ url_for('student_register') }}">Register as a Student</a></p>
    </form>
</section>
{% endblock %}
